name: expense-practice
services:
  app:
    build: .
    image: expense-tracker:1.0.0
    ports:
      # Local access is sufficient for the practice demonstration.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      HTTP_PORT: "8080"
      STATIC_DIR: /app/static
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [app_net]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # No published database port: only the app can connect through app_net.
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks: [app_net]
volumes:
  db_data:
networks:
  app_net:
    driver: bridge
